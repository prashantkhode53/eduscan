name: eduscan
description: AI-powered student face identification and attendance system
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.11.0
  # Keeps the device screen awake while the Face Scan Attendance screen is open
  # so it never dims/locks mid-session. WAKE_LOCK permission already declared in
  # AndroidManifest.xml. Enabled only while that screen is mounted.
  wakelock_plus: ^1.2.5
  image: ^4.1.7
  image_picker: ^1.0.7
  provider: ^6.1.2
  http: ^1.2.1
  connectivity_plus: ^5.0.2
  sqflite: ^2.3.3+1
  # Windows desktop only: provides the sqflite database factory on Windows.
  # Wired up exclusively inside `if (Platform.isWindows)` in main.dart, so
  # Android continues to use the native sqflite plugin and is unaffected.
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.66.2
  pdf: ^3.10.8
  open_filex: ^4.3.4
  qr_flutter: ^4.1.0
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3
  intl: ^0.19.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  file_picker: ^8.0.0
  excel: ^4.0.6
  flutter_tts: ">=4.0.2 <4.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Build-time only: packages the Windows build into an installable .msix.
  # Never shipped in the Android APK (dev dependencies are not bundled).
  msix: ^3.16.7

# Vendored flutter_tts with a one-line Windows CMake fix (links `windowsapp` so
# the WinRT activation runtime symbols resolve). Upstream 4.1.0 fails to link on
# Windows (LNK2019). Source is byte-for-byte the pub.dev 4.1.0 release except for
# third_party/flutter_tts/windows/CMakeLists.txt. Android/iOS code is unchanged,
# so this override does not affect the APK.
dependency_overrides:
  flutter_tts:
    path: third_party/flutter_tts

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf

# Windows installer (.msix) configuration. Used only by `dart run msix:create`
# after `flutter build windows --release`. Has no effect on the Android build.
msix_config:
  display_name: EduScan
  publisher_display_name: EduScan
  identity_name: com.eduscan.app
  msix_version: 1.0.0.0
  logo_path: assets/images/logo.png
  # No restricted capabilities are needed: the Windows build excludes camera,
  # microphone and push notifications. Network access is implicit.
  capabilities: internetClient
