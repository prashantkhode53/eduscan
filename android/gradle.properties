org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# R8 full mode: more aggressive shrinking and optimization
android.enableR8.fullMode=true

# Kotlin incremental compilation disabled: the project (D:) and the Flutter pub
# cache (C:) live on different Windows drives, which makes the incremental
# compiler's relocatable path logic throw "this and base files have different
# roots" and corrupt its caches for every Kotlin plugin. Full (non-incremental)
# compilation avoids the cross-drive relativeTo() crash.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Gradle configuration cache (speeds up CI builds)
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Suppress the Gradle / Java / AGP / KGP *version* dependency-validation
# warnings (e.g. "Flutter support for your Gradle version will soon be
# dropped"). This is the property form of the
# --android-skip-build-dependency-validation CLI flag.
# NOTE: this does NOT silence the "applies the Kotlin Gradle Plugin (KGP)"
# warnings — those come from a separate, always-on check in the Flutter
# Gradle plugin (detectApplyingKotlinGradlePlugin) that has no opt-out flag.
# Those are silenced only by routing the build log level below ERROR (see
# the --quiet build wrapper) or by the plugin authors migrating to
# Built-in Kotlin.
skipDependencyChecks=true
